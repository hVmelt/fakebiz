<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MiniBiz Dashboard</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <h1>MiniBiz Dashboard</h1>
    <p>Products • Customers • Orders • Reports</p>
  </header>

  <main class="grid">
    <section class="card">
      <h2>Create Product</h2>
      <form id="productForm">
        <label>SKU <input id="sku" required /></label>
        <label>Name <input id="name" required /></label>
        <label>Price <input id="price" type="number" step="0.01" min="0" required /></label>
        <label>Stock <input id="stock" type="number" step="1" min="0" value="0" required /></label>
        <button type="submit">Create</button>
      </form>
      <pre id="productCreateResult" class="output"></pre>
    </section>

    <section class="card">
      <h2>Products</h2>
      <button id="refreshProducts">Refresh</button>
      <table id="productsTable">
        <thead>
          <tr><th>ID</th><th>SKU</th><th>Name</th><th>Price</th><th>Stock</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Reports</h2>
      <div class="row">
        <button id="loadRevenue">Revenue</button>
        <button id="loadTop">Top Products</button>
        <button id="loadLowStock">Low Stock</button>
      </div>
      <pre id="reportsOut" class="output"></pre>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
