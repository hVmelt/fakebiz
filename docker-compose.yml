services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: minibiz
      POSTGRES_PASSWORD: minibizpw
      POSTGRES_DB: minibiz
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://minibiz:minibizpw@db:5432/minibiz
    volumes:
      # mount your local code into the container
      - ./api/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  db_data:
