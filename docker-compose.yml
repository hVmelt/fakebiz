
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: minibiz
      POSTGRES_PASSWORD: minibizpw
      POSTGRES_DB: minibiz
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
